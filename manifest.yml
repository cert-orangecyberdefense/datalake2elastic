format_version: 3.5.0
name: ti_orangecyberdefense_datalake
title: "Orange Cyberdefense Datalake"
version: 0.0.1 # Please also bump the version of the UA in cel.yml.hbs
source:
  license: "Apache-2.0"
description: "Powered by Orange Cyberdefense Datalake platform, this threat intelligence integration provides insights on IP addresses, domains and various other indicators for threat investigations."
type: integration
categories:
  - security
  - threat_intel
conditions:
  kibana:
    version: "^9.1.3"
  elastic:
    subscription: "basic"
screenshots:
  - src: /img/sample-screenshot.png
    title: Sample screenshot
    size: 600x600
    type: image/png
icons:
  - src: /img/orange-logo.svg
    title: Orange logo
    size: 32x32
    type: image/svg+xml
policy_templates:
  - name: datalake
    title: Orange Cyberdefense Datalake
    description: Collect indicators from Orange Cyberdefense Datalake.
    inputs:
      - type: cel
        title: Collect indicators from Datalake
        description: Collect indicators from Orange Cyberdefense Datalake CTI.
        vars:
          - name: datalake_env
            type: select
            title: Datalake Environment
            required: true
            show_user: true
            multi: false
            options:
              - text: prod
                value: prod
              - text: preprod
                value: preprod
            default: prod
          - name: datalake_token
            type: password
            title: Datalake Long Term Token
            description: >-
              Datalake API token, also called long term token. Go to ["My Account"](https://datalake.cert.orangecyberdefense.com/gui/my-account) to generate one. The account must have the Datalake bulk_search permission.
            required: true
            show_user: true
            secret: true
            multi: false
          - name: datalake_query_hash
            type: text
            title: Datalake Query Hash
            description: >-
              Datalake query hash for indicators you want to import. First, you have to make a query that matches what you want to import on Datalake. Then, from the results page URL, you can get the query hash and paste it here.
            required: true
            show_user: true
            multi: false
            default: 442ef63d19e86aecbd3eca23acd239e8

owner:
  github: cert-orangecyberdefense
  type: partner
